plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version '2.3.21'
    id 'application'
    id 'jacoco'
    id 'com.diffplug.spotless' version '7.0.4'
}

group = 'com.example'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

kotlin {
    jvmToolchain(25)
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_25)
        freeCompilerArgs.add("-Xjsr305=strict")
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // --- Jackson BOM: keep all Jackson modules in sync ---
    implementation platform("com.fasterxml.jackson:jackson-bom:2.20.1")

    implementation "com.fasterxml.jackson.core:jackson-databind"
    implementation "com.fasterxml.jackson.module:jackson-module-kotlin"
    implementation "com.fasterxml.jackson.core:jackson-annotations"

    // HTTP client
    implementation "org.apache.httpcomponents.client5:httpclient5:5.5.1"

    // Codec / utils
    implementation "commons-codec:commons-codec:1.20.0"

    // Apache Commons
    implementation "org.apache.commons:commons-lang3:3.20.0"
    implementation "commons-io:commons-io:2.21.0"

    // Logging
    implementation "org.slf4j:slf4j-api:2.0.18"
    runtimeOnly "org.slf4j:slf4j-simple:2.0.18"

    // Lombok (compile-time only)
    compileOnly "org.projectlombok:lombok:1.18.42"
    annotationProcessor "org.projectlombok:lombok:1.18.42"

    // Testing (JUnit 6 via BOM)
    testImplementation platform("org.junit:junit-bom:6.1.0")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "org.mockito:mockito-junit-jupiter:5.23.0"
    testImplementation "org.mockito:mockito-core:5.23.0"
    testImplementation "org.mockito.kotlin:mockito-kotlin:5.4.0"
    testImplementation "org.hamcrest:hamcrest:3.0"
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

// Coverage configuration shared between report and verification. Excludes:
//   * MainKt              — top-level CLI mains that call live exchange APIs
//   * HttpMessageSender*  — Apache HttpClient wrapper + its Companion factory
//   * HttpRequestFailed*  — exception class (fields only)
//   * WithdrawalAuditLog$Companion — file-system audit-log factory (openDefault)
def coverageExcludes = [
    '**/MainKt.class',
    '**/HttpMessageSender*.class',
    '**/HttpRequestFailed*.class',
    '**/WithdrawalAuditLog$Companion.class',
]

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
    afterEvaluate {
        classDirectories.setFrom(
            files(classDirectories.files.collect {
                fileTree(dir: it, exclude: coverageExcludes)
            })
        )
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    afterEvaluate {
        classDirectories.setFrom(
            files(classDirectories.files.collect {
                fileTree(dir: it, exclude: coverageExcludes)
            })
        )
    }
    violationRules {
        rule {
            limit {
                counter = 'INSTRUCTION'
                value = 'COVEREDRATIO'
                minimum = 0.90
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

spotless {
    kotlin {
        target 'src/**/*.kt'
        ktlint('1.5.0').editorConfigOverride([
            'max_line_length': '160',
        ])
    }
    kotlinGradle {
        target '*.gradle.kts'
        ktlint('1.5.0')
    }
}

application {
    // Kotlin main in src/main/kotlin/io/github/damian1000/portfolio/binance/Main.kt
    mainClass = 'io.github.damian1000.portfolio.binance.MainKt'
}

plugins {
    id 'io.github.damian1000.kotlin-conventions' version '0.2.0'
    id 'application'
}

group = 'io.github.damian1000'
version = '1.0-SNAPSHOT'

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

kotlin {
    compilerOptions {
        freeCompilerArgs.add('-Xjsr305=strict')
    }
}

dependencies {
    // Jackson BOM: keep all Jackson modules in sync.
    implementation platform('com.fasterxml.jackson:jackson-bom:2.22.1')
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.module:jackson-module-kotlin'
    implementation 'com.fasterxml.jackson.core:jackson-annotations'

    implementation 'org.apache.httpcomponents.client5:httpclient5:5.6.2'
    implementation 'commons-codec:commons-codec:1.22.0'
    implementation 'org.apache.commons:commons-lang3:3.20.0'
    implementation 'commons-io:commons-io:2.22.0'
    implementation 'org.slf4j:slf4j-api:2.0.18'
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.18'

    // Lombok (compile-time only)
    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'

    testImplementation 'org.mockito:mockito-junit-jupiter:5.23.0'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:6.3.0'
    testImplementation 'org.hamcrest:hamcrest:3.0'
}

application {
    // Kotlin main in src/main/kotlin/io/github/damian1000/portfolio/binance/Main.kt
    mainClass = 'io.github.damian1000.portfolio.binance.MainKt'
}

// CLI entry points only: `main` runs the app and calls System.exit, which can't be exercised in a
// unit test. Everything else is covered by tests.
def coverageExcludes = ['**/MainKt.class']

jacocoTestReport {
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: coverageExcludes)
        }))
    }
}

jacocoTestCoverageVerification {
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: coverageExcludes)
        }))
    }
}
